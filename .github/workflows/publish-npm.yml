name: 发布 npm 包

on:
  release:
    types: [published]
  workflow_call:
    inputs:
      tag_name:
        description: 要发布的 Git tag（例如 v1.4.0）
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag_name:
        description: 要发布的 Git tag（例如 v1.4.0）
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # 被 release-please 调用时 github.event_name 仍是调用方的 push，不是 workflow_call。
      TAG_NAME: ${{ inputs.tag_name || github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.tag_name || github.event.release.tag_name }}

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: 校验版本
        id: package
        run: |
          version=$(node -p "require('./package.json').version")
          echo "TAG_NAME=$TAG_NAME version=$version"
          test -n "$TAG_NAME"
          test "v$version" = "$TAG_NAME"
          name=$(node -p "require('./package.json').name")
          npm view "$name@$version" version >/dev/null 2>&1 && echo "exists=true" >> "$GITHUB_OUTPUT" || true

      - if: steps.package.outputs.exists != 'true'
        run: npm ci
      - if: steps.package.outputs.exists != 'true'
        run: npm test
      - if: steps.package.outputs.exists != 'true'
        run: npm run pack:verify
      - if: steps.package.outputs.exists != 'true'
        run: npm publish --access public --provenance
