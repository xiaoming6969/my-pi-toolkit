<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Browser Review</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="d2h.css">
</head>
<body>
  <header class="titlebar">
    <p class="product">M-PI</p>
    <div class="document-title">
      <h1 id="title">正在载入…</h1>
      <p id="subtitle" class="subtitle"></p>
    </div>
    <button id="cancel" class="secondary titlebar-action" type="button">关闭审阅</button>
  </header>
  <main class="workbench">
    <section class="editor" aria-label="审阅内容">
      <div class="editor-tabs">
        <span class="editor-tab" aria-hidden="true">审阅内容</span>
        <div id="view-toggle" class="view-toggle" role="group" aria-label="视图" hidden>
          <button id="preview-tab" type="button" aria-pressed="true">预览</button>
          <button id="source-tab" type="button" aria-pressed="false">源码</button>
          <button id="split-tab" type="button" aria-pressed="false" hidden>并排</button>
          <button id="inline-tab" type="button" aria-pressed="false" hidden>内联</button>
        </div>
      </div>
      <div class="editor-content" id="editor-content">
        <nav id="diff-files" class="diff-files" hidden></nav>
        <div id="diff-pane" class="diff-pane">
          <article id="preview" class="markdown-preview" aria-label="Markdown 预览" hidden></article>
          <div id="d2h" class="d2h-pane" hidden></div>
          <div id="lines" class="lines" role="list"></div>
        </div>
      </div>
    </section>
    <aside class="sidebar" aria-label="批注编辑器">
      <div class="sidebar-title"><h2>批注</h2></div>
      <div class="sidebar-content">
        <p id="selection" class="hint">选择起止行后添加评论</p>
        <label for="comment">评论</label>
        <textarea id="comment" rows="5" placeholder="说明需要修改的内容"></textarea>
        <button id="add" type="button">添加批注</button>
        <div id="annotations" class="annotations" aria-live="polite"></div>
        <p id="error" class="error" role="alert"></p>
      </div>
      <div class="actions">
        <button id="approve" class="approve" type="button" hidden>批准并实现</button>
        <button id="defer" class="secondary" type="button" hidden>批准但暂不实现</button>
        <button id="feedback" type="button">发送批注</button>
        <button id="abandon" class="danger" type="button" hidden>取消计划</button>
      </div>
    </aside>
  </main>
  <script type="module" src="review.js"></script>
</body>
</html>
